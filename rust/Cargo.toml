[package]
name = "rust_lib_durecmix"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
# Web builds carry only the pure-Rust engine core; the native-only features
# come back via the target block below (docs/PLAN-PWA.md).
durecmix-engine = { path = "../engine", default-features = false }
anyhow = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
durecmix-engine = { path = "../engine", default-features = false, features = [
  "playback",
  "mp3",
] }

# The browser gets MP3 too, just from a different encoder (Shine, pure Rust).
# Kept in a wasm-only block on purpose: in the shared [dependencies] block
# above, Cargo's feature unification would compile Shine into every native
# build as well.
[target.'cfg(target_family = "wasm")'.dependencies]
durecmix-engine = { path = "../engine", default-features = false, features = [
  "mp3-shine",
] }

# ndk_context handshake for cpal's AAudio backend — see src/android.rs.
[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.4"
ndk-context = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
