name: Release

# Two entry points:
#  - push to main: if pubspec.yaml's version has no v<version> tag yet, this
#    run creates the tag and publishes the release (so every merged PR that
#    bumps the version ships automatically; docs-only PRs without a bump
#    skip). The tag is created with GITHUB_TOKEN, which deliberately does
#    NOT trigger a second run — this same run builds the artifacts.
#  - manual tag push (v*): builds and publishes for that tag as before.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

# Serialize releases but never cancel one: a run killed between `git push` of
# the tag and the release upload would leave a tagged version with no
# artifacts, and the next push to main sees the tag and skips.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Pinned deliberately — see ci.yml.
  FLUTTER_VERSION: "3.41.2"

jobs:
  version:
    name: Determine release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        name: Tag main when the pubspec version is unreleased
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -n 's/^version: \([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          if [[ -z "$version" ]]; then
            echo "::error::no version found in pubspec.yaml"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "v$version already released — nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "v$version"
            git push origin "v$version"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            build: flutter build macos --release --dart-define=DURECMIX_FEEDBACK_TOKEN=$DURECMIX_FEEDBACK_TOKEN
            package: ditto -c -k --keepParent build/macos/Build/Products/Release/Mixstack.app mixstack-${{ needs.version.outputs.tag }}-macos.zip
            artifact: mixstack-${{ needs.version.outputs.tag }}-macos.zip
          - name: Windows
            os: windows-latest
            build: flutter build windows --release --dart-define=DURECMIX_FEEDBACK_TOKEN=$DURECMIX_FEEDBACK_TOKEN
            package: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath mixstack-${{ needs.version.outputs.tag }}-windows.zip
            artifact: mixstack-${{ needs.version.outputs.tag }}-windows.zip
          - name: Android
            os: ubuntu-latest
            build: flutter build apk --release --flavor github --dart-define=DURECMIX_FEEDBACK_TOKEN=$DURECMIX_FEEDBACK_TOKEN
            package: cp build/app/outputs/flutter-apk/app-github-release.apk mixstack-${{ needs.version.outputs.tag }}-android.apk
            artifact: mixstack-${{ needs.version.outputs.tag }}-android.apk
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Set up Java (Android)
        if: matrix.name == 'Android'
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up release signing (Android)
        # Stable keystore from secrets — APKs signed with it can UPDATE an
        # existing installation. Without the secrets the build falls back to
        # a runner-generated debug key (installable, but not update-capable),
        # hence the hard failure to avoid shipping such an artifact again.
        if: matrix.name == 'Android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret missing — refusing to release a debug-signed APK"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
          {
            echo "storeFile=../release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=durecmix"
          } > android/key.properties
      - run: flutter pub get
      # bash on every OS so $DURECMIX_FEEDBACK_TOKEN expands uniformly; an
      # absent secret just builds tokenless (feedback falls back to the
      # pre-filled browser issue form).
      - run: ${{ matrix.build }}
        shell: bash
        env:
          DURECMIX_FEEDBACK_TOKEN: ${{ secrets.DURECMIX_FEEDBACK_TOKEN }}
      - run: ${{ matrix.package }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}
      # AAB for the Play Store — same signing as the APK above. Deliberately
      # NOT part of the GitHub Release: an .aab isn't installable and would
      # just confuse people next to the APK. Kept as its own workflow
      # artifact and picked up by the `play` job below.
      #
      # No DURECMIX_FEEDBACK_TOKEN here: it's a compile-time const
      # (lib/state/feedback.dart), so passing it would bake the token into a
      # binary that ships to strangers. PLAY_STORE=true already routes
      # feedback through the tokenless issue form at runtime, but the string
      # would still be extractable from the bundle if defined.
      - name: Build Play bundle (AAB)
        if: matrix.name == 'Android'
        run: |
          flutter build appbundle --release --flavor play --dart-define=PLAY_STORE=true
          cp build/app/outputs/bundle/playRelease/app-play-release.aab \
             "mixstack-${{ needs.version.outputs.tag }}.aab"
      - uses: actions/upload-artifact@v7
        if: matrix.name == 'Android'
        with:
          name: android-aab
          path: mixstack-${{ needs.version.outputs.tag }}.aab
          if-no-files-found: error
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: |
            mixstack-*.zip
            mixstack-*.apk
          # Every merge publishes a PRERELEASE, never "latest" — that's the
          # whole channel trick: update_check.dart queries /releases/latest,
          # and GitHub never returns a prerelease there, neither the version
          # hint nor the APK for the in-app update. Nobody sees this until
          # promote.yml promotes it.
          #
          # make_latest: false is not optional alongside prerelease: true —
          # without it GitHub still marks the newest release "latest" even
          # when it's a prerelease.
          prerelease: true
          make_latest: false

  # AAB into the Play Console internal test track — pattern from PilzBuddy /
  # Fahrgemeinschaft (see docs/PLAN-PLAYSTORE.md). A separate job AFTER the
  # release, not folded into `build`: a Play-side failure (quota, a 503) then
  # only costs this job — the release itself still stands, and re-running
  # just this job later picks the artifact back up (90-day retention).
  #
  # Draft only, never published: a human still promotes it in the Console.
  # Inert without secrets.PLAY_SERVICE_ACCOUNT_JSON — until the Play Console
  # side of docs/PLAN-PLAYSTORE.md §3 is done, every run just skips here.
  play:
    name: Upload to Play (internal, draft)
    needs: [version, release]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No AAB if the Android leg's keystore secrets were missing — nothing
      # to do then either.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: android-aab
      # `secrets` isn't available in step `if:` — reading it here first and
      # branching on the step's own output avoids that.
      - name: Play access and bundle present?
        id: play
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SA" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "why=PLAY_SERVICE_ACCOUNT_JSON secret missing" >> "$GITHUB_OUTPUT"
          elif ! ls mixstack-*.aab > /dev/null 2>&1; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "why=no AAB from this run (Android keystore secrets missing?)" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload to Play internal testing
        if: steps.play.outputs.have == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.mcbuchi.mixstack
          releaseFiles: mixstack-${{ needs.version.outputs.tag }}.aab
          tracks: internal
          status: draft
      - name: Play upload skipped
        if: steps.play.outputs.have == 'false'
        env:
          WHY: ${{ steps.play.outputs.why }}
        run: |
          {
            echo "### Not uploaded to Play — $WHY"
            echo ""
            echo "Setup: docs/PLAN-PLAYSTORE.md"
          } >> "$GITHUB_STEP_SUMMARY"
