<?xml version="1.0" encoding="UTF-8"?>
<!-- Mixstack Play-Funktionsgrafik, 1024x500. Aufbau aus assets/icon/logo.svg,
     damit Store und App dieselbe Bildsprache tragen. Deckender Hintergrund:
     Play erlaubt auf der Funktionsgrafik keinen Alphakanal. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141b28"/>
      <stop offset="1" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d5a80"/>
      <stop offset="0.55" stop-color="#41a7e0"/>
      <stop offset="1" stop-color="#7fdcff"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Das Logo links, auf halbe Grösse skaliert und vertikal zentriert:
       1024er-Viewbox * 0.44 = 450, also (500-450)/2 = 25 Versatz. -->
  <g transform="translate(18,25) scale(0.44)">
    <g fill="none" stroke="url(#stream)" stroke-width="34" stroke-linecap="round" opacity="0.85">
      <path d="M140,252 L340,252 C580,252 600,442 866,442"/>
      <path d="M140,356 L340,356 C580,356 600,442 866,442"/>
      <path d="M140,460 L340,460 C580,460 600,442 866,442"/>
      <path d="M140,564 L340,564 C580,564 600,582 866,582"/>
      <path d="M140,668 L340,668 C580,668 600,582 866,582"/>
      <path d="M140,772 L340,772 C580,772 600,582 866,582"/>
    </g>
    <circle cx="866" cy="442" r="40" fill="#eaf7ff"/>
    <circle cx="866" cy="582" r="40" fill="#eaf7ff"/>
    <g fill="#dce8f5">
      <circle cx="236" cy="252" r="22"/><circle cx="292" cy="356" r="22"/>
      <circle cx="204" cy="460" r="22"/><circle cx="308" cy="564" r="22"/>
      <circle cx="248" cy="668" r="22"/><circle cx="188" cy="772" r="22"/>
    </g>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="470" y="212" fill="#eaf7ff" font-size="86" font-weight="600"
          letter-spacing="-1">Mixstack</text>
    <text x="472" y="272" fill="#7fdcff" font-size="30" font-weight="500"
          letter-spacing="0.5">Multichannel WAV &#8594; Stereo</text>
    <text x="472" y="326" fill="#8fa3bd" font-size="25">Mischen, mastern, exportieren</text>
    <text x="472" y="362" fill="#8fa3bd" font-size="25">&#8212; vollständig offline</text>
  </g>
</svg>
